name: Lint

on:
  push:
    branches-ignore:
      - production
      - stating
    paths:
      - '**/*.tf'

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate terraform configuration
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.0
        
      - name: Harden Runner
        uses: step-security/harden-runner@v2.12.0
        with:
          egress-policy: audit

      - name: terraform validate
        uses: dflook/terraform-validate@v2.0.0
        with:
          path: workload/terraform/jamfpro

  fmt-check:
    runs-on: ubuntu-latest
    name: Check formatting of terraform files
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.0

      - name: terraform fmt
        uses: dflook/terraform-fmt-check@v2.0.0
        with:
          path: workload/terraform/jamfpro
      
      - name: Wrong formatting found
        if: ${{ failure() && steps.fmt-check.outputs.failure-reason == 'fmt-check' }}
        run: echo "formatting check failed"